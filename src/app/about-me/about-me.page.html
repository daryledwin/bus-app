<ion-content [fullscreen]="true" class="about-page">
  <main class="about-shell">
    <button type="button" class="about-back-button" aria-label="Back to home" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>

    <section class="about-hero" aria-labelledby="about-title">
      <div class="about-skyline" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <img class="about-bus-illustration" src="assets/images/bus%20uncle.png" alt="" aria-hidden="true" />

      <div class="about-chip">
        <ion-icon name="sparkles-outline"></ion-icon>
        Meet the maker
      </div>
      <h1 id="about-title">Built with care</h1>
      <p>for everyday commutes</p>

      <div class="about-story">
Hi there, I'm an SMU Software Engineering student. I built MyBus SG to create a bus app that feels modern, calming, and commuter-friendly. Hope it makes your daily commute a little lighter!    </div>
    </section>

    <button type="button" class="about-review-card" (click)="openReviewPage()">
      <span class="about-review-card__icon" aria-hidden="true">
        <ion-icon name="star-outline"></ion-icon>
      </span>
      <span class="about-review-card__copy">
        <strong>Loving the app?</strong>
        <small>A quick review means a lot 💛</small>
      </span>
      <ion-icon class="about-review-card__chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </button>

    <footer class="about-footer">
      made with love for everyday commuters 🚌❤️
    </footer>
  </main>
</ion-content>
