<ion-content [fullscreen]="true" class="nearby-page">
  <ion-refresher
    class="nearby-refresher"
    slot="fixed"
    pullFactor="0.55"
    pullMin="74"
    pullMax="126"
    (ionRefresh)="refreshNearbyStops($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    ></ion-refresher-content>
  </ion-refresher>

  <main class="nearby-shell">
    <header class="nearby-header fade-in">
      <div>
        <p>nearby stops</p>
        <h1>catch a ride nearby</h1>
      </div>
    </header>

    <section class="nearby-map-card pop-in" aria-label="Nearby bus stops map">
      <div #nearbyMap class="nearby-map"></div>
      <button
        type="button"
        class="nearby-locate-button"
        aria-label="Recenter map on your location"
        [disabled]="!hasUserLocation || isLoadingLocation"
        (click)="recenterOnUserLocation()"
      >
        <ion-icon name="locate-outline"></ion-icon>
      </button>
    </section>

    <section class="nearby-state fade-in-delayed" *ngIf="isLoadingLocation && !nearbyStops.length" aria-live="polite">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Finding bus stops around you.</p>
    </section>

    <section class="nearby-state nearby-state--error fade-in-delayed" *ngIf="!isLoadingLocation && nearbyError" aria-live="polite">
      <ion-icon name="location-outline"></ion-icon>
      <div>
        <p>{{ nearbyError }}</p>
        <button type="button" (click)="loadNearbyStops()">Try again</button>
      </div>
    </section>

    <section class="nearby-list" *ngIf="nearbyStops.length">
      <article
        class="nearby-stop-card"
        [class.selected]="selectedNearbyStop?.BusStopCode === stop.BusStopCode"
        role="button"
        tabindex="0"
        *ngFor="let stop of nearbyStops; let i = index; trackBy: trackNearbyStop"
        [style.animation-delay.ms]="120 + (35 * i)"
        (click)="selectNearbyStop(stop)"
        (keydown.enter)="selectNearbyStop(stop)"
      >
        <button
          type="button"
          class="nearby-favourite-button"
          [class.active]="isFavouriteStop(stop)"
          [class.saved-pop]="recentlyToggledFavouriteCode === stop.BusStopCode && recentFavouriteAction === 'saved'"
          [class.removed-pop]="recentlyToggledFavouriteCode === stop.BusStopCode && recentFavouriteAction === 'removed'"
          [attr.aria-label]="isFavouriteStop(stop) ? 'Remove favourite stop' : 'Save favourite stop'"
          (click)="toggleFavouriteStop(stop); $event.stopPropagation()"
        >
          <ion-icon [name]="isFavouriteStop(stop) ? 'heart' : 'heart-outline'"></ion-icon>
          <span class="favourite-sparkles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
        <div class="nearby-stop-card__marker">
          <ion-icon name="bus-outline"></ion-icon>
        </div>
        <div class="nearby-stop-card__copy">
          <h2>{{ stop.Description }}</h2>
          <p>{{ stop.RoadName }} · {{ stop.BusStopCode }}</p>
          <div class="nearby-stop-card__footer">
            <span class="nearby-distance" [ngClass]="'nearby-distance--' + nearbyDistanceTone(stop.distanceMeters)">
              {{ distanceLabel(stop.distanceMeters) }}
            </span>
            <button type="button" (click)="viewBuses(stop); $event.stopPropagation()">
              View buses
            </button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <nav slot="fixed" class="bottom-nav" aria-label="Bus navigation">
    <button type="button" routerLink="/tabs/tab1" routerDirection="root" aria-label="Home">
      <ion-icon name="home-outline"></ion-icon>
      <span>Home</span>
    </button>
    <button type="button" class="active" aria-label="Nearby stops">
      <ion-icon name="navigate-outline"></ion-icon>
      <span>Nearby</span>
    </button>
  </nav>
</ion-content>
