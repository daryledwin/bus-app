<ion-content [fullscreen]="true" class="routes-page">
  <main class="routes-shell">
    <header class="routes-hero">
      <div>
        <p>Bus Routes</p>
        <h1>Plan the little journey ahead</h1>
        <span>routes will feel right at home here</span>
      </div>
      <div class="routes-hero__icon" aria-hidden="true">
        <ion-icon name="map-outline"></ion-icon>
      </div>
    </header>

    <section class="routes-group" aria-label="Bus route tools">
      <article class="routes-row">
        <span class="routes-row__icon">
          <ion-icon name="git-branch-outline"></ion-icon>
        </span>
        <div>
          <h2>Route explorer</h2>
          <p>See stops, direction, and your next transfer.</p>
        </div>
        <ion-icon class="routes-row__chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </article>

      <article class="routes-row">
        <span class="routes-row__icon routes-row__icon--warm">
          <ion-icon name="sparkles-outline"></ion-icon>
        </span>
        <div>
          <h2>Favourite routes</h2>
          <p>Keep your everyday rides close by.</p>
        </div>
        <ion-icon class="routes-row__chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </article>
    </section>
  </main>
</ion-content>
